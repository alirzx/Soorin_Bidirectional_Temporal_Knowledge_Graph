# Independent Soorin deployment. No default upstream image and no source build.
services:
  db:
    image: ${SOORIN_DB_IMAGE:?Set a reviewed pgvector PostgreSQL 16 image digest}
    restart: unless-stopped
    environment:
      POSTGRES_USER: utopia
      POSTGRES_DB: utopia
      POSTGRES_PASSWORD: ${SOORIN_DB_OWNER_PASSWORD:?Set the migration owner password}
      UTOPIA_APP_DB_PASSWORD: ${SOORIN_DB_RUNTIME_PASSWORD:?Set the separate runtime password}
    volumes:
      - soorin_production_db:/var/lib/postgresql/data
      - ./docker/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    networks: [database]
    security_opt: [no-new-privileges:true]
    cap_drop: [NET_RAW]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: [CMD-SHELL, pg_isready -U utopia -d utopia]
      interval: 10s
      timeout: 3s
      retries: 10
  app:
    image: ${SOORIN_IMAGE:?Set a qualified Soorin image digest; no image is published by this template}
    user: '65532:65532'
    init: true
    restart: unless-stopped
    read_only: true
    # Docker defaults to safe 1777 mode for /tmp; keep this as one tmpfs mount.
    tmpfs:
      - /tmp:size=256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    environment:
      UTOPIA_DATABASE_URL: ${SOORIN_RUNTIME_DATABASE_URL:?Set runtime URL for utopia_app}
      UTOPIA_MIGRATION_URL: ${SOORIN_MIGRATION_DATABASE_URL:?Set separate migration URL}
      UTOPIA_BIND_ADDR: 0.0.0.0:1516
      UTOPIA_WEB_DIST: /app/web-dist
      UTOPIA_DATA_DIR: /app/data
      UTOPIA_JWT_SECRET: ${UTOPIA_JWT_SECRET:?Set a random signing secret}
      UTOPIA_SECRET_KEY: ${UTOPIA_SECRET_KEY:?Set a 32-byte encryption key as hex or base64}
      UTOPIA_OPEN_REGISTRATION: 'false'
      UTOPIA_COOKIE_SECURE: 'true'
      UTOPIA_CORS_ORIGIN: ${SOORIN_PUBLIC_ORIGIN:?Set the exact HTTPS origin}
      UTOPIA_DB_MAX_CONNECTIONS: ${SOORIN_DB_MAX_CONNECTIONS:-16}
      UTOPIA_MODEL_TEST_MODE: '0'
      UTOPIA_SOC_ALLOW_SENSITIVE_PAYLOAD: '0'
      UTOPIA_MODEL_TRUSTED_ORIGINS: ${UTOPIA_MODEL_TRUSTED_ORIGINS:-}
      UTOPIA_PRIVACY_GATEWAY_URL: ${UTOPIA_PRIVACY_GATEWAY_URL:-}
      UTOPIA_PRIVACY_GATEWAY_KEY: ${UTOPIA_PRIVACY_GATEWAY_KEY:-}
      UTOPIA_PRIVACY_TENANT_MAP: ${UTOPIA_PRIVACY_TENANT_MAP:-}
      UTOPIA_PRIVACY_PROVIDER_ORIGINS: ${UTOPIA_PRIVACY_PROVIDER_ORIGINS:-}
      UTOPIA_PRIVACY_PROFILE: ${UTOPIA_PRIVACY_PROFILE:-agentic-soc-v1}
      RUST_LOG: info
    ports: ['${SOORIN_APP_BIND:-127.0.0.1:2516}:1516']
    volumes: [soorin_production_data:/app/data]
    networks: [database, models, egress]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, --max-time, '3', http://127.0.0.1:1516/api/v1/health]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
networks:
  database:
    internal: true
  models:
    internal: true
  egress: {}
volumes:
  soorin_production_db:
  soorin_production_data:
