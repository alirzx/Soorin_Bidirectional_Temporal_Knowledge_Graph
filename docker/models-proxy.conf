worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 64; }

http {
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 300000;
    client_body_timeout 10s;
    client_header_timeout 10s;
    proxy_connect_timeout 3s;
    proxy_send_timeout 15s;
    proxy_read_timeout 300s;
    proxy_next_upstream off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    server {
        listen 8080;
        location ~ ^/(v1/(embeddings|models)|ready|health)$ {
            set $role models-embedding;
            proxy_pass http://$role:8080;
        }
        location / { return 404; }
    }
    server {
        listen 8081;
        location ~ ^/(rerank|v1/models|ready|health)$ {
            set $role models-reranker;
            proxy_pass http://$role:8080;
        }
        location / { return 404; }
    }
    server {
        listen 8082;
        location ~ ^/(ner|v1/models|ready|health)$ {
            set $role models-ner;
            proxy_pass http://$role:8080;
        }
        location / { return 404; }
    }
}
