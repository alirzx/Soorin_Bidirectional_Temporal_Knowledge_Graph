# Isolated source build for Sprint 1. This compose project does not reuse the
# rc9 database volume or ./data bind mount. Use an explicit project name.
services:
  db:
    image: ${UTOPIA_DB_IMAGE:-pgvector/pgvector:pg16}
    environment:
      POSTGRES_USER: utopia
      POSTGRES_PASSWORD: ${SOORIN_DEV_DB_PASSWORD:-utopia-dev-only}
      POSTGRES_DB: utopia
    ports:
      - "${SOORIN_DEV_DB_BIND:-127.0.0.1:2517}:5432"
    volumes:
      - soorin_sprint1_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U utopia -d utopia"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        CARGO_BUILD_JOBS: ${SOORIN_BUILD_JOBS:-1}
        NODE_BASE_IMAGE: ${SOORIN_NODE_BASE_IMAGE:-docker.arvancloud.ir/node:20-slim}
        RUST_BASE_IMAGE: ${SOORIN_RUST_BASE_IMAGE:-docker.arvancloud.ir/rust:1.99.1-slim-bookworm}
        DEBIAN_BASE_IMAGE: ${SOORIN_DEBIAN_BASE_IMAGE:-docker.arvancloud.ir/debian:bookworm-slim}
        NPM_REGISTRY_URL: ${NPM_REGISTRY_URL:-https://package-mirror.liara.ir/repository/npm/}
        NPM_FALLBACK_REGISTRY_URL: ${NPM_FALLBACK_REGISTRY_URL:-https://registry.npmjs.org/}
        APT_PRIMARY_DEBIAN_URL: ${APT_PRIMARY_DEBIAN_URL:-https://mirror.arvancloud.ir/debian}
        APT_PRIMARY_SECURITY_URL: ${APT_PRIMARY_SECURITY_URL:-https://mirror.arvancloud.ir/debian-security}
        APT_FALLBACK_DEBIAN_URL: ${APT_FALLBACK_DEBIAN_URL:-https://mirror.metanet.ch/debian}
        APT_FALLBACK_SECURITY_URL: ${APT_FALLBACK_SECURITY_URL:-https://mirror.metanet.ch/debian-security}
        APT_LAST_DEBIAN_URL: ${APT_LAST_DEBIAN_URL:-https://mirrors.huaweicloud.com/repository/debian}
        APT_LAST_SECURITY_URL: ${APT_LAST_SECURITY_URL:-https://mirrors.huaweicloud.com/repository/debian-security}
    environment:
      UTOPIA_DATABASE_URL: postgres://utopia:${SOORIN_DEV_DB_PASSWORD:-utopia-dev-only}@db:5432/utopia
      UTOPIA_BIND_ADDR: 0.0.0.0:1516
      UTOPIA_WEB_DIST: /app/web-dist
      UTOPIA_DATA_DIR: /app/data
      # False still permits the first bootstrap account, then keeps public
      # registration closed. The port remains loopback-only as a second guard.
      UTOPIA_OPEN_REGISTRATION: "false"
      UTOPIA_DB_MAX_CONNECTIONS: ${SOORIN_DEV_DB_MAX_CONNECTIONS:-8}
      UTOPIA_MODEL_TRUSTED_ORIGINS: ${UTOPIA_MODEL_TRUSTED_ORIGINS:-http://models:8080,http://models:8081,http://models:8082}
      UTOPIA_PRIVACY_GATEWAY_URL: ${UTOPIA_PRIVACY_GATEWAY_URL:-}
      UTOPIA_PRIVACY_GATEWAY_KEY: ${UTOPIA_PRIVACY_GATEWAY_KEY:-}
      UTOPIA_PRIVACY_TENANT_MAP: ${UTOPIA_PRIVACY_TENANT_MAP:-}
      UTOPIA_PRIVACY_PROVIDER_ORIGINS: ${UTOPIA_PRIVACY_PROVIDER_ORIGINS:-}
      UTOPIA_PRIVACY_PROFILE: ${UTOPIA_PRIVACY_PROFILE:-agentic-soc-v1}
    ports:
      - "${SOORIN_DEV_APP_BIND:-127.0.0.1:2516}:1516"
    volumes:
      - soorin_sprint1_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:1516/api/v1/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

volumes:
  soorin_sprint1_db:
  soorin_sprint1_data:
