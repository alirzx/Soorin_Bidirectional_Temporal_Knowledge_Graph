# Add to docker-compose.soorin-dev.yml. Model profiles start independently.
x-model: &model
  build:
    context: .
    dockerfile: docker/models.Dockerfile
    args:
      PYTHON_BASE_IMAGE: ${SOORIN_PYTHON_BASE_IMAGE:-docker.arvancloud.ir/python:3.12-slim-bookworm}
      PIP_PRIMARY_INDEX_URL: ${PIP_PRIMARY_INDEX_URL:-https://package-mirror.liara.ir/repository/pypi/simple}
      PIP_FALLBACK_INDEX_URL: ${PIP_FALLBACK_INDEX_URL:-https://mirror2.chabokan.net/pypi/simple/}
      TORCH_CPU_INDEX_URL: ${TORCH_CPU_INDEX_URL:-https://download.pytorch.org/whl/cpu}
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp:size=256m,mode=1777]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  cpus: 2
  mem_limit: 4g
  environment:
    HF_HOME: /models
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
    SOORIN_MODEL_THREADS: "2"
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/ready',timeout=3)"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 120s
services:
  embedding:
    <<: *model
    profiles: [embedding]
    command: [serve, --role, embedding, --host, 0.0.0.0]
    ports: [127.0.0.1:2811:8080]
    volumes: [soorin_embedding_cache:/models:ro]
  reranker:
    <<: *model
    profiles: [reranker]
    command: [serve, --role, reranker, --host, 0.0.0.0]
    ports: [127.0.0.1:2812:8080]
    volumes: [soorin_reranker_cache:/models:ro]
  ner:
    <<: *model
    profiles: [ner]
    command: [serve, --role, ner, --host, 0.0.0.0]
    ports: [127.0.0.1:2813:8080]
    volumes: [soorin_ner_cache:/models:ro]
volumes:
  soorin_embedding_cache:
  soorin_reranker_cache:
  soorin_ner_cache:
