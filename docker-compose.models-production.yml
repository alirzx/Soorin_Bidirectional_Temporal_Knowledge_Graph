# Production overlay: one qualified CPU model image, one process, three
# read-only persistent model snapshots. No ports published on the host.
services:
  models:
    image: ${SOORIN_MODEL_IMAGE:?Set reviewed CPU model image digest}
    profiles: [models]
    user: '65532:65532'
    command: [serve-all, --host, 0.0.0.0, --cache, /models]
    init: true
    read_only: true
    restart: unless-stopped
    tmpfs:
      - /tmp:size=256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    cpus: 3
    mem_limit: 7g
    networks: [models]
    environment:
      HF_HOME: /models
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      SOORIN_MODEL_THREADS: '2'
    volumes:
      - soorin_embedding_cache:/models/embedding:ro
      - soorin_reranker_cache:/models/reranker:ro
      - soorin_ner_cache:/models/ner:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; [urllib.request.urlopen('http://127.0.0.1:%s/ready'%p,timeout=3) for p in (8080,8081,8082)]"]
      interval: 30s
      timeout: 12s
      retries: 6
      start_period: 240s
volumes:
  soorin_embedding_cache:
  soorin_reranker_cache:
  soorin_ner_cache:
